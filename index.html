<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر هودا | Hoda Shop</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0;color:#222}
header{background:#ff2e63;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:32px}
.hero{text-align:center;padding:25px 15px;background:#ffe0e9}
.hero a{display:inline-block;margin-top:12px;background:#25D366;color:white;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border:1px solid #eee;border-radius:15px;overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:140px;object-fit:cover}
.card h3{margin:10px 0 3px;font-size:17px}
.price{color:#ff2e63;font-weight:bold;font-size:18px;display:block;margin:7px 0}
.btn{background:#ff2e63;color:white;border:none;padding:9px 18px;border-radius:20px;font-size:15px}
footer{background:#222;color:white;text-align:center;padding:18px}
</style>
</head>
<body>
<header><h1>متجر هودا 🛍️</h1><p>أشيك حاجة بأحسن سعر في طنطا</p></header>
<div class="hero"><h2>توصيل سريع لكل طنطا 🚀</h2><a href="https://wa.me/201000000000">اطلب على واتساب 💬</a></div>
<div class="products">
<div class="card"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"><h3>ساعة شيك</h3><span class="price">250 ج.م</span><button class="btn">اطلب الان</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"><h3>كوتشي رياضي</h3><span class="price">450 ج.م</span><button class="btn">اطلب الان</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"><h3>تيشيرت قطن</h3><span class="price">180 ج.م</span><button class="btn">اطلب الان</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"><h3>شنطة بناتي</h3><span class="price">320 ج.م</span><button class="btn">اطلب الان</button></div>
</div>
<footer>متجر هودا - طنطا</footer>
</body>
</html>
